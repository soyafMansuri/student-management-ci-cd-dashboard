name: student-management

services:
  app:
    image: ${IMAGE_REPO:-student-management-system}:${IMAGE_TAG:-local}
    build:
      context: .
      args:
        GIT_SHA: ${IMAGE_TAG:-local}
    container_name: student-app
    restart: unless-stopped
    expose:
      - "8000"                      # private: only Nginx (same Docker network) can reach it
    volumes:
      - student_data:/data          # SQLite database lives here
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  nginx:
    image: nginx:1.27-alpine
    container_name: student-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # Separate container: stays up even if the student app is broken.
  dashboard:
    image: ${IMAGE_REPO:-student-management-system}:${IMAGE_TAG:-local}
    container_name: student-dashboard
    restart: unless-stopped
    command: ["gunicorn", "--bind", "0.0.0.0:8081", "--workers", "1", "--threads", "4", "--access-logfile", "-",
              "--access-logformat", "%(h)s \"%(m)s %(U)s\" %(s)s %(L)s", "dashboard.app:app"]
    environment:
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      IMAGE_REPO: ${IMAGE_REPO:-}
      DASHBOARD_USER: ${DASHBOARD_USER:-admin}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
      DASHBOARD_REFRESH_SECONDS: ${DASHBOARD_REFRESH_SECONDS:-20}
      APP_HEALTH_URL: http://app:8000/api/health
    ports:
      - "${DASHBOARD_PORT:-8081}:8081"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/healthz', timeout=4).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

volumes:
  student_data:
